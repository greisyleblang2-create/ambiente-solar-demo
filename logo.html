<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leblang Automatisierung — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--offwhite:#F7F5F2;--black:#1A1A1A;--bronze:#A67C52;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{-webkit-font-smoothing:antialiased;}
  body{margin:0;background:var(--offwhite);color:var(--black);
    font-family:"Inter",-apple-system,Segoe UI,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:48px;}
  .logo{width:100%;max-width:600px;}
  .logo svg{display:block;width:100%;height:auto;}
  text{font-family:"Inter",-apple-system,Segoe UI,Arial,sans-serif;}
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 484 158" role="img" aria-label="Leblang Automatisierung">

      <!-- Kästchen (schwarz, dünnere Umrandung) -->
      <g fill="#F7F5F2" stroke="#1A1A1A" stroke-width="4">
        <rect x="28" y="18"    width="40" height="22" rx="6"/>
        <rect x="28" y="61.5"  width="40" height="22" rx="6"/>
        <rect x="28" y="105"   width="40" height="22" rx="6"/>
      </g>

      <!-- Pfeil-Faden (bronze) – Eingang nur als Linie, Abstand zu den Kästchen -->
      <g stroke="#A67C52" stroke-width="3.5" fill="none" stroke-linecap="round">
        <line x1="6" y1="29" x2="24.5" y2="29"/>
        <path d="M71.5 29 A13 21.75 0 0 1 71.5 72.5"/>
        <path d="M24.5 72.5 A13 21.75 0 0 0 24.5 116"/>
        <line x1="71.5" y1="116" x2="461" y2="116"/>
      </g>

      <!-- Pfeilspitze (nur Ausgang) -->
      <g fill="#A67C52">
        <polygon points="461,111.5 461,120.5 470,116"/>
      </g>

      <!-- Wortmarke -->
      <text x="98" y="50" font-size="44" font-weight="600" letter-spacing="0.5" fill="#A67C52">LEBLANG</text>
      <text x="98" y="96" font-size="44" font-weight="600" fill="#1A1A1A" textLength="372" lengthAdjust="spacing">Automatisierung</text>
      <text x="98" y="140" font-size="18" font-weight="400" fill="#1A1A1A" fill-opacity="0.65">Prozesse automatisieren. Zeit gewinnen.</text>

    </svg>
  </div>
</body>
</html>
